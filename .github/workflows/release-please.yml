name: Release-please

# release-please maintains a "chore(flow-schema): release X.Y.Z" PR that
# bumps packages/flow-schema and updates its CHANGELOG from conventional
# commits. Merging the PR cuts a `flow-schema-vX.Y.Z` tag + GitHub release,
# which triggers the npm publish job below.
#
# Publishing is gated on the RELEASE_ENABLED repository variable (plus the
# NPM_TOKEN secret) so nothing can reach the registry while the repo is
# private — flipping the repo public is: set the variable, add the token.
# The Rust twin lives in release-plz.yml (tags `wavekat-flow-vX.Y.Z`).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      flow_schema_released: ${{ steps.release.outputs['packages/flow-schema--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    needs: release-please
    if: needs.release-please.outputs.flow_schema_released == 'true' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs typecheck + test + build before the tarball is cut.
      - run: pnpm --filter @wavekat/flow-schema publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
