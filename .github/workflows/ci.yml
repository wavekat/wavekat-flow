name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate types from schema and fail on drift
        run: |
          pnpm --filter @wavekat/flow-schema gen
          if ! git diff --exit-code -- packages/flow-schema/src/generated; then
            echo "::error::generated types are stale — run 'pnpm --filter @wavekat/flow-schema gen' and commit"
            exit 1
          fi
      - run: pnpm --filter @wavekat/flow-schema typecheck
      - run: pnpm --filter @wavekat/flow-schema test
      - name: Build the publishable artifact (dist/)
        run: pnpm --filter @wavekat/flow-schema build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test (types regenerate from the schema on build)
        run: cargo test -p wavekat-flow
      - name: Fail on stale crate-local schema copy (synced by build.rs)
        run: |
          if ! git diff --exit-code -- crates/wavekat-flow/schema; then
            echo "::error::crate-local schema copy is stale — run 'cargo build -p wavekat-flow' and commit"
            exit 1
          fi
      - name: Verify the crate builds from its own package tarball
        run: cargo package -p wavekat-flow

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # keep in sync with workspace rust-version in Cargo.toml
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p wavekat-flow --all-targets
