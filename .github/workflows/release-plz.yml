name: Release-plz

# release-plz maintains a release PR that bumps the wavekat-flow crate and
# its CHANGELOG from conventional commits; the release job publishes merged,
# unpublished versions to crates.io and cuts a `wavekat-flow-vX.Y.Z` tag +
# GitHub release.
#
# Publishing is gated on the RELEASE_ENABLED repository variable (plus the
# CARGO_REGISTRY_TOKEN secret) so nothing can reach the registry while the
# repo is private — flipping the repo public is: set the variable, add the
# token. The TS twin lives in release-please.yml (tags `flow-schema-vX.Y.Z`).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-plz-release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    needs: release-plz-release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          echo "## Release PR" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.release-plz.outputs.prs_created }}" = "true" ]; then
            echo "Release PR created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release PR created." >> "$GITHUB_STEP_SUMMARY"
          fi
