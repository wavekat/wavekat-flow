schema_version: 3
id: flow_ask_question
name: Ask a question
entry: ask
nodes:
  ask:
    kind: menu
    prompt: "Claude has a question. Which database? Press 1 for Postgres. Press 2 for SQLite. Press 9 to hear this again."
    options: { "1": Postgres, "2": SQLite, "9": Repeat }
    retries: 2
    timeout_secs: 8
    exits: { "1": thanks, "2": thanks, "9": ask, no_input: bye, invalid: bye }
  thanks:
    kind: hangup
    prompt: Got it, thanks. Goodbye.
  bye:
    kind: hangup
    prompt: No answer recorded. The question will wait on screen. Goodbye.
