schema_version: 1
id: flow_defaults
name: Defaults are left out
entry: welcome
nodes:
  welcome:
    kind: greeting
    prompt: Hello.
    exits: { next: menu }
  menu:
    kind: menu
    prompt: Press 1 for sales.
    options: { "1": Sales }
    exits: { "1": vm, no_input: vm, invalid: vm }
  vm:
    kind: message
    prompt: Leave a message.
  open:
    kind: hours
    schedule: {}
    timezone: UTC
    exits: { open: welcome, closed: vm }
  bye:
    kind: hangup
