# Rust release automation (twin of release-please-config.json for npm).
# Tag/release names are prefixed with the crate name so they can never
# collide with release-please's `flow-schema-v*` tags in the same repo.

[workspace]
git_tag_enable = true
git_release_enable = true

[[package]]
name = "wavekat-flow"
git_tag_name = "wavekat-flow-v{{ version }}"
git_release_name = "wavekat-flow-v{{ version }}"
