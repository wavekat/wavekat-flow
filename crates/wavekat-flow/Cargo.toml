[package]
name = "wavekat-flow"
# Literal (not workspace-inherited) so release-please's Cargo updater can
# bump it — the cargo-workspace plugin doesn't rewrite [workspace.package].
version = "0.0.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Declarative call-flow (\"Receptionist\") document model for the WaveKat voice platform. Types are generated from the normative JSON Schema (schema/flow.v1.schema.json), the single source of truth shared with the @wavekat/flow-schema npm package."
readme = "README.md"
keywords = ["ivr", "call-flow", "voice", "telephony"]
categories = ["data-structures", "parser-implementations"]
# The conformance suite reads ../../conformance, which only exists in the
# repo checkout — don't ship a test that can't run from the packaged crate.
exclude = ["tests/"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["macros", "parsing"] }
time-tz = "2"

[build-dependencies]
typify = "0.4"
schemars = "0.8"
serde_json = "1"
prettyplease = "0.2"
syn = "2"

[dev-dependencies]
jsonschema = "0.29"
tokio = { version = "1", features = ["macros", "rt"] }
